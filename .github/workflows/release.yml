name: Release Avalonia GUI

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64

          - os: windows-latest
            rid: win-x86

          - os: windows-latest
            rid: win-arm64

          - os: ubuntu-latest
            rid: linux-x64

          - os: ubuntu-24.04-arm
            rid: linux-arm64

          - os: macos-latest
            rid: osx-arm64

          - os: macos-15-intel
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenccNetLibGui.sln

      - name: Build
        run: >
          dotnet build OpenccNetLibGui.sln
          --configuration Release
          --no-restore

      # Standard framework-dependent single-file build.
      - name: Publish (Standard)
        run: >
          dotnet publish OpenccNetLibGui.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish-standard/
          --no-self-contained
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      # NativeAOT standalone build.
      - name: Publish (NativeAOT)
        run: >
          dotnet publish OpenccNetLibGui.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output publish-aot/
          -p:PublishAot=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $rid = "${{ matrix.rid }}"

          $standard = "OpenccNetLibGui-$tag-$rid"
          $aot = "OpenccNetLibGui-$tag-$rid-aot"

          Rename-Item -Path publish-standard -NewName $standard
          Rename-Item -Path publish-aot -NewName $aot

          Compress-Archive `
            -Path "$standard\*" `
            -DestinationPath "$standard.zip"

          Compress-Archive `
            -Path "$aot\*" `
            -DestinationPath "$aot.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          rid="${{ matrix.rid }}"

          standard="OpenccNetLibGui-$tag-$rid"
          aot="OpenccNetLibGui-$tag-$rid-aot"

          mv publish-standard "$standard"
          mv publish-aot "$aot"

          tar -czf "$standard.tar.gz" "$standard"
          tar -czf "$aot.tar.gz" "$aot"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenccNetLibGui-${{ matrix.rid }}
          path: |
            OpenccNetLibGui-*.zip
            OpenccNetLibGui-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Show downloaded files
        run: ls -R artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}